# Postgres + Redis for official @atproto/dev-env (TestNetwork).
# Ports and credentials match bluesky-social/atproto packages/dev-infra.
# AppView / PDS / Ozone / PLC / bsync are Node processes, not these images.

services:
  db_test:
    image: postgres:14.4-alpine
    command: -c 'max_connections=1000'
    environment:
      POSTGRES_USER: pg
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pg"]
      interval: 1s
      timeout: 10s
      retries: 30

  redis_test:
    image: redis:7.0-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "[ \"$$(redis-cli ping)\" = \"PONG\" ]"]
      interval: 1s
      timeout: 10s
      retries: 30
