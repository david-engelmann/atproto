# This is a basic workflow to help you get started with Actions

name: TestSuite

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:

  #  schedule:
  #    - cron: '15 * * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04

        ocaml-compiler:
          - 4.14.1

    runs-on: ${{ matrix.os }}
    env:
        USERNAME: "vim"
        USER_UID: 1000
        USER_GID: 1000
    container:
        image: ocaml/opam:${{ matrix.os }}
        options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          dune-cache: true
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          opam-disable-sandboxing: true

      - name: Cache opam dependencies
        uses: actions/cache@v4
        id: opam-cache
        with:
          path: ~/.opam
          key: ${{ runner.os }}-opam-${{ hashFiles('**/*.opam') }}
          restore-keys: |
            ${{ runner.os }}-opam-

      - name: Install Common Libs
        run: opam install async base core uri yojson ptime cohttp cohttp-lwt-unix cohttp-async h2 httpaf httpaf-lwt-unix h2-lwt-unix lwt core_kernel ssl lwt_ssl jose digestif mirage-crypto-ec mirage-crypto-rng zarith ounit ounit2 ppx_jane qcheck dune ocamlformat
#      - name: Install Repo
#        run: opam install . --deps-only --with-doc --with-test
      - name: Dune Build
        run: opam exec -- dune build
        env:
          ATP_AUTH: ${{ secrets.ATP_AUTH }}
          ATP_HOST: ${{ secrets.ATP_HOST }}
      - name: Dune Test
        run: opam exec -- dune runtest 2>&1 | tee dune_runtest.log
        env:
          ATP_AUTH: ${{ secrets.ATP_AUTH }}
          ATP_HOST: ${{ secrets.ATP_HOST }}
      - name: Upload Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dune_runtest
          path: dune_runtest.log
          if-no-files-found: warn

  lint-doc:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04

        ocaml-compiler:
          - 4.14.1

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          dune-cache: true
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          opam-disable-sandboxing: true

      - name: Lint doc
        uses: ocaml/setup-ocaml/lint-doc@v3

  lint-fmt:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04

        ocaml-compiler:
          - 4.14.1

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          dune-cache: true
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          opam-disable-sandboxing: true

      - name: Lint fmt
        uses: ocaml/setup-ocaml/lint-fmt@v3

  # Runs on the GitHub-hosted VM (Docker available). Not inside ocaml/opam.
  local-pds:
    runs-on: ubuntu-22.04
    env:
      ATP_SCHEME: http
      ATP_HOST: localhost:2583
      ATP_AUTH: alice.test:local-pds-ci-password
      ATP_LOCAL_PDS: "1"
      ATP_REQUIRE_LOCAL_PDS: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start official PDS + PLC
        run: ./scripts/local-pds.sh up

      - name: Create local test account
        run: ./scripts/local-pds.sh account

      - name: Use OCaml 4.14.1
        uses: ocaml/setup-ocaml@v3
        with:
          dune-cache: true
          ocaml-compiler: 4.14.1
          opam-disable-sandboxing: true

      - name: Cache opam dependencies
        uses: actions/cache@v4
        id: opam-cache
        with:
          path: ~/.opam
          key: ${{ runner.os }}-opam-pds-${{ hashFiles('**/*.opam') }}
          restore-keys: |
            ${{ runner.os }}-opam-pds-
            ${{ runner.os }}-opam-

      - name: Install Common Libs
        run: opam install async base core uri yojson ptime cohttp cohttp-lwt-unix cohttp-async h2 httpaf httpaf-lwt-unix h2-lwt-unix lwt core_kernel ssl lwt_ssl jose digestif mirage-crypto-ec mirage-crypto-rng zarith ounit ounit2 ppx_jane qcheck dune ocamlformat

      - name: Dune Build
        run: opam exec -- dune build

      - name: Local PDS integration tests
        run: |
          set -o pipefail
          opam exec -- dune exec -- test/test_local_pds.exe 2>&1 | tee local_pds_runtest.log

      - name: PDS logs
        if: always()
        run: ./scripts/local-pds.sh logs

      - name: Upload Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local_pds_runtest
          path: local_pds_runtest.log
          if-no-files-found: warn
