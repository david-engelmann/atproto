# This is a basic workflow to help you get started with Actions

name: TestSuite

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:

  #  schedule:
  #    - cron: '15 * * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Package-style build: opam lint + the same `dune build -p` a dependent / `opam install` sees.
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04

        ocaml-compiler:
          - 4.14.1

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install libzstd
        run: sudo apt-get update && sudo apt-get install -y libzstd-dev

      - name: Use OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          opam-disable-sandboxing: true

      - name: opam lint
        run: opam lint atproto.opam

      - name: Install package dependencies
        run: opam install . --deps-only --with-test

      - name: Dune Build
        run: opam exec -- dune build -p atproto
        env:
          ATP_AUTH: ${{ secrets.ATP_AUTH }}
          ATP_HOST: ${{ secrets.ATP_HOST }}
      - name: Dune Test
        run: opam exec -- dune runtest -p atproto 2>&1 | tee dune_runtest.log
        env:
          ATP_AUTH: ${{ secrets.ATP_AUTH }}
          ATP_HOST: ${{ secrets.ATP_HOST }}
      - name: Upload Log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dune_runtest
          path: dune_runtest.log
          if-no-files-found: warn

  lint-doc:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04

        ocaml-compiler:
          - 4.14.1

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install libzstd
        run: sudo apt-get update && sudo apt-get install -y libzstd-dev

      - name: Use OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          opam-disable-sandboxing: true

      - name: Lint doc
        uses: ocaml/setup-ocaml/lint-doc@v3

      - name: Install doc dependencies
        run: opam install . --deps-only --with-doc

      - name: Build odoc HTML
        run: opam exec -- dune build @doc

      - name: Upload odoc HTML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: odoc-html
          path: _build/default/_doc/_html
          if-no-files-found: warn

      # PRs keep the odoc-html artifact above. Pages deploy is main-only.
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _build/default/_doc/_html

  # Official GitHub Actions Pages path. Pages is enabled
  # (Settings → Pages → Source: GitHub Actions). deploy-pages runs on
  # push to main; pull requests keep the odoc-html artifact only.
  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: lint-doc
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  lint-fmt:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04

        ocaml-compiler:
          - 4.14.1

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          opam-disable-sandboxing: true

      - name: Lint fmt
        uses: ocaml/setup-ocaml/lint-fmt@v3

  lint-opam:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04

        ocaml-compiler:
          - 4.14.1

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install libzstd
        run: sudo apt-get update && sudo apt-get install -y libzstd-dev

      - name: Use OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          opam-disable-sandboxing: true

      - name: Lint opam
        uses: ocaml/setup-ocaml/lint-opam@v3

  # Runs on the GitHub-hosted VM (Docker + Node available). Not inside ocaml/opam.
  # Official @atproto/dev-env TestNetwork: PLC + PDS + AppView + Ozone + bsync.
  local-pds:
    runs-on: ubuntu-22.04
    env:
      ATP_SCHEME: http
      ATP_HOST: localhost:2583
      ATP_APPVIEW_HOST: localhost:2584
      ATP_OZONE_HOST: localhost:2587
      ATP_AUTH: alice.test:hunter2
      ATP_AUTH_BOB: bob.test:hunter2
      ATP_AUTH_OZONE: admin-mod.test:admin-mod-pass
      ATP_LOCAL_PDS: "1"
      ATP_REQUIRE_LOCAL_PDS: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Cache @atproto/dev-env
        uses: actions/cache@v6
        with:
          path: docker/dev-env/node_modules
          key: ${{ runner.os }}-dev-env-${{ hashFiles('docker/dev-env/package.json') }}
          restore-keys: |
            ${{ runner.os }}-dev-env-

      - name: Start official PDS + AppView + Ozone
        run: ./scripts/local-atproto.sh up

      - name: Confirm mock accounts
        run: ./scripts/local-atproto.sh account

      - name: Install libzstd
        run: sudo apt-get update && sudo apt-get install -y libzstd-dev

      - name: Use OCaml 4.14.1
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 4.14.1
          opam-disable-sandboxing: true

      - name: Install package dependencies
        run: opam install . --deps-only --with-test

      - name: Dune Build
        run: opam exec -- dune build -p atproto

      - name: Local PDS + AppView + Ozone integration tests
        run: |
          set -euo pipefail
          if [ -f docker/dev-env/generated.env ]; then
            set -a
            # shellcheck disable=SC1091
            . docker/dev-env/generated.env
            set +a
          fi
          export ATP_REQUIRE_LOCAL_PDS=1
          export OUNIT_RUNNER=sequential
          {
            opam exec -- dune exec -- test/test_local_pds.exe
            opam exec -- dune exec -- test/test_local_appview.exe
            opam exec -- dune exec -- test/test_local_ozone.exe
            opam exec -- dune exec -- test/test_local_oauth.exe
          } 2>&1 | tee local_pds_runtest.log

      - name: Network logs
        if: always()
        run: ./scripts/local-atproto.sh logs

      - name: Upload Log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: local_pds_runtest
          path: local_pds_runtest.log
          if-no-files-found: warn
